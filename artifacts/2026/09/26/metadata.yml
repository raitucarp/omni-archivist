  pov: third_person_omniscient
  image_prompt: A hyper-detailed sci-fi concept art depicting a cybernetic megalopolis organized according to high-dimensional topological manifolds. Server monoliths rise over misty, desolate river basins under a neon-streaked overcast sky, with mathematical wireframes, multidimensional data clouds, and fiber-optic conduits spanning across futuristic infrastructure.
  aesthetic:
    art_style: cinematic 70mm Panavision sci-fi keyframe with anamorphic lens flare and film grain
    color_palette: "monochromatic amber and dark umber: reminiscent of vintage phosphor computer monitors"
    composition: isometric cutaway architectural perspective revealing labyrinthine alien interior
    lighting: blinding searchlight beams piercing through perpetual toxic rain and industrial steam
