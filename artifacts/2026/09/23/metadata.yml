  pov: third_person_omniscient
  image_prompt: A sprawling post-industrial megacity dissolving into an opalescent, geometric honeycomb lattice, illuminated by bioluminescent chemical reaction matrices and venting glowing noble gases beneath a gray sky, photorealistic, intricate technical detail, cinematic hard sci-fi aesthetic.
  aesthetic:
    art_style: 1970s vintage analog sci-fi paperback cover art, painted gouache and acrylic texture
    color_palette: "martian rust: oxidized red dust, raw copper, and pale peach horizon"
    composition: cinematic ultrawide 2.39:1 aspect ratio with sweeping panoramic vista
    lighting: warm golden-hour celestial glow contrasting against deep cold space shadows
    mood: quiet contemplative solitude drifting through the silent void
    subject_matter: A lone automated chemoinformatic monitoring structure perched above a decaying ecumenopolis of carnalized, iridescent spongy bedrock.
    prompt: Cinematic ultrawide 2.39:1 panoramic vista capturing a silent, decaying ecumenopolis where inorganic bedrock has dissolved into an opalescent, spongy honeycomb matrix. A solitary, weathered chemoinformatic sensor spire perches atop a fractured silicate precipice overlooking vast automated chemical conduits and venting extraction vaults. Frigid, luminous krypton mists pool in deep, pitch-black abyssal chasms beneath. A low, radiant golden-hour celestial glow grazes the porous mineral architecture, casting sweeping cold shadows across chalky grey terraces and viscous polymer cascades. The atmosphere hangs dense with micro-particulates, evoking a profound, contemplative solitude amidst systemic post-industrial stillness.
  cover_path: cover.png
