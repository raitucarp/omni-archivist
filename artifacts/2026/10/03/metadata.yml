    prompt: An intricate isometric cutaway architectural perspective revealing the labyrinthine interior of a failing subterranean biopolymer node. Ribbed vaults of engineered protein scaffolding and tendon-like trusses sag under mechanical shear, exposing fractured actinic conduits and weeping biological bulkheads slick with hydrolytic moisture. Eerie, pulsing cyan and necrotic amber bioluminescence illuminates the damp, organic cavern walls and pools of viscous metabolic broth. Seized fibrous ventilation throttles and autonomous surveillance sensor arrays are embedded into the fleshy, calcifying infrastructure, tangled within sprawling cytoskeletal fibers. The scene evokes intense claustrophobic paranoia and dystopian biomechanical decay, rendered with hyper-detailed textures, atmospheric haze, and cinematic volumetric shadows.
