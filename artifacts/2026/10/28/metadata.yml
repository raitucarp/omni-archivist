      - the vocal resonator as the loss of internal interiority
      - the argillaceous cliff as inert, opaque geological time
  pov: third_person_limited
  image_prompt: A sprawling opticpunk metropolis built from layered translucent glass, mirrors, and prism-shaped spires carved into argillaceous shale cliffs. Golden actinic light beams crisscross misty overcast skies, refracting through giant floating lenses and polychrome diffraction gratings. In the foreground, an artisan in dust-covered utilitarian velvet and optic goggles inspects a massive glowing glass quadric surface covered in faint concentric holographic fringes, cinematic lighting, retro-futuristic detailing.
  aesthetic:
    art_style: Moebius-inspired European ligne claire sci-fi graphic novel art style, crisp ink outlines and flat pastel gradients
    color_palette: "industrial brutalist: weathered concrete gray, damp asphalt, and vivid hazard yellow"
    composition: intimate high-contrast claustrophobic close-up with intense shallow depth of field
    lighting: dramatic volumetric god rays cutting through dense swirling atmospheric dust and mist
    mood: gritty dangerous survival against a merciless alien environment
    subject_matter: A weathered optical technician whispering into a glowing fused-silica acoustic resonator amidst swirling silica dust and fractured waveguide beams.
    prompt: An intimate, claustrophobic close-up of a weathered, soot-streaked technician speaking into an intricately etched fused-silica acoustic resonator in a subterranean optical audit trench. A razor-thin depth of field isolates trembling, silt-dusted hands steadying a heavy quadric glass prism coated in viscous dark sealing pitch. Dramatic volumetric god rays slice through dense, swirling clouds of pulverized silica dust and steam. Harsh coherent teal photonic light bleeds from fractured optical waveguides, casting high-contrast specular highlights against coarse wet shale and rusted cast-iron tools. The atmosphere is frigid and perilous, charged with gritty survival tension and smoldering amber brazier rim-lighting.
  cover_path: cover.png
