    duration: scene_dominant
    frequency: singulative
    micro_emplotment: suspense_driven
  characters:
  - name: Sariha Bel-Habbash
    gender: Female
    description: A sinewy field-epigrapher of the outer halo whose weathered hands are dusted with powdered silicates from ancient refractory grains, driven by an unyielding impulse to engrave mortal experience into stellar trajectories.
    role: Lead Kinematic Sculptor and Epigraphic Epigrapher
    actant_role: protagonist
    complexity: round
    development: dynamic
    characterisation: mixed
    individuation:
      physical: Tall and wiry with radiation micro-burns along the collarbone, draped in pressurized high-altitude caftans layered over vacuum-rigs with grounding copper filaments.
      mental: Suffers from chronostrain, a hyper-acute perception of deep-time intervals that renders immediate bureaucratic politics both trivial and agonizingly urgent.
      behavioural: Rhythmically rubs raw quartz pebbles between her knuckles while inspecting kinematic projections and refuses to observe the galactic disk without dark filtering prisms.
    motivation: To etch civilizational memory permanently into the orbital resonance patterns of the galactic halo before entropy and cosmological drift dissolve all record of conscious life.
    conflict: Endures internal guilt over permanently altering pristine cosmic strata while battling an aggressive administrative blockade mounted by traditionalist academies intent on impounding her thruster arrays.
  - name: Nandi Osei-Tutu
    gender: Non-binary
    description: An austere, velvet-voiced halo conservator whose diplomatic courtliness masks an uncompromising ideological refusal to permit human interference with primordial cosmic kinematics.
    role: Chief Conservator of the Galactic Baseline Sanctuaries
    actant_role: opponent
    complexity: round
    development: static
    characterisation: indirect
    individuation:
      physical: Impeccably groomed with close-cropped silver hair and an upright posture, wearing basalt-dyed weighted silk stoles designed to simulate gravity in zero-g station corridors.
      mental: Possesses an encyclopedic memory of ancient galactic baselines, motivated by a terror that human perturbations will trigger uncontrollable coronal plasma instabilities.
      behavioural: Speaks in measured, low-amplitude cadences that force whole assembly rooms to quiet down, constantly cleaning optical calibration lenses with linen cloths.
    motivation: To preserve the primordial kinematic equilibrium of the outer halo as an untouched wilderness reserve, free from human intervention.
    conflict: Privately realizes that the halo is already suffering natural tidal disruption, yet publicly escalates enforcement actions against epigrapher fringe stations.
  - name: Tupaq Rimachi
    gender: Male
    description: A rugged telemetry mechanic and vacuum diver from the low-metallicity fringe polities, skilled at diagnosing algorithmic spasms with bespoke dampening protocols.
    role: Resonance Propulsion Fitter and Telemetry Diver
    actant_role: deuteragonist
    complexity: round
    development: dynamic
    characterisation: direct
    individuation:
      physical: Broad-shouldered with synthetic tendon grafts along both forearms, exhibiting skin tinted with a faint cyanotic cast caused by long-term exposure to sub-Kelvin gas environments.
      mental: Processes astrophysics through mechanical shear stresses and fluid flow dynamics rather than pure geometry, fiercely loyal to station crews over academic factions.
      behavioural: Taps out syncopated three-beat rhythms against bulkheads using a bronze wrench when tracking telemetry, sipping bitter chicory infusions from an insulated suction bulb.
    motivation: To secure heavy-element endowments and autonomous standing for his marginalized fringe community by proving their indispensability in large-scale cosmic engineering.
    conflict: Torn between cynical weariness toward intellectual dogma and the lethal occupational hazards of mounting kinetic thrusters to unstable dwarf clusters.
  - name: Morio Tanizaki
    gender: Male
    description: An elderly spectroscopist and tactile cartographer who lost his sight to high-luminance core flashes, now translating stellar trajectories into acoustic polyphonies.
    role: Acoustic Cartographer and Philosophical Mentor
    actant_role: mentor
    complexity: round
    development: static
    characterisation: mixed
    individuation:
      physical: Frail, stooped posture with clouded, unseeing eyes shielded behind round horn-rimmed obsidian spectacles, swathed in oversized hand-loomed wool cardigans.
      mental: Translates multi-body orbital mechanics into musical timbres and chord progressions, maintaining a detached perspective toward inter-station factionalism.
      behavioural: Wears bone-conduction transducers clamped against his temples, softly humming resonant fundamental tones that harmonize with the background vibration of the observatory.
    motivation: To compose an enduring acoustic record of stellar streams that harmonizes deep-time gravitational mechanics with classical aesthetic beauty.
    conflict: Struggles with deteriorating sensory faculties while trying to restrain the Epigraphic Faction from triggering catastrophic disk collisions.
  scene_sequels:
  - scene:
      goal:
        description: Sariha Bel-Habbash aims to map the pristine Yazoo-type flows and magnetic zig-zag folds in the outer galactic halo to locate an uncorrupted dwarf cluster for kinematic inscription.
        stakes:
          external: Losing track of the fragile stream to natural dispersion will destroy the only viable canvas for civilizational memory.
          internal: Facing the self-doubt of desecrating a pristine wilderness untouched for billions of years.
      conflict:
        opposition:
          type: environment
          description: The frigid sixty-Kelvin gas clouds and volatile magnetic field lines induce severe sensor attenuation across the raw quartz observatories.
        escalation:
          beats:
          - Magnetic shear causes the electron-beam diffraction sensors to lose focus on refractory dust grains.
          - A sudden gas collapse shifts the stream baseline, blinding the exterior quartz arrays.
          - Micrometeorite impacts rattle the fieldstone frame, forcing emergency manual calibration.
      disaster:
        outcome: Partial success
        consequence:
          plot: Sariha secures the cluster coordinates, but discovers natural tidal disruption is already dissolving its core faster than anticipated.
          character: She realizes that the outer halo is not an eternal sanctuary, sharpening her resolve against passive preservation.
    sequel:
      reaction:
        emotional:
          immediate: A suffocating mix of awe and dread at the sheer scale of cosmic decay.
          physical: A rapid pulse pounding against her temples and cold sweat cooling beneath her environmental suit.
        processing: She recognizes that natural forces will erase the stream regardless of human non-intervention.
      dilemma:
        options:
        - choice: Disclose the natural decay immediately to the Traditionalist Academies.
          cost: Surrendering research autonomy to bureaucratic jurisdiction.
          risk: The Conservators may classify the zone as an off-limits reserve and bar all access.
        - choice: Keep the telemetry private and recruit sympathetic fringe scholars.
          cost: Operating under threat of criminal prosecution and censure.
          risk: Failing alone without institutional backing or heavy-element resources.
      decision:
        chosen_option: Keep the telemetry private and recruit sympathetic fringe scholars.
        rationale: Institutions will stall until the dwarf remnant is torn apart by galactic shear.
        new_goal: Confront the Academy assembly to challenge their doctrine of passive non-intervention.
    context: MO
