  characters:
  - name: Xochitl Morounfolu
    gender: Female
    description: A pragmatic topological surveyor with deep walnut skin, sharp observant hazel eyes, and a weathered gait earned from traversing non-Euclidean wetlands.
    role: Senior Hydrological Surveyor for the Fox River Basin Mapping Guild
    actant_role: protagonist
    complexity: round
    development: dynamic
    characterisation: mixed
    individuation:
      physical: Tall and lean, bearing chemical burns on her forearms from alkaline surveyor reagents; wears oilcloth coats lined with copper shielding wire.
      mental: Compulsive adherence to observational rigor; experiences acute intellectual vertigo when empirical reality fails to conform to associative closure.
      behavioural: Subconsciously traces Cayley tables with her index finger onto the seam of her trousers when distressed; carries a pocket set of basalt balancing weights.
    motivation: To accurately chart and publish empirical measurements of non-associative field deformations along the Fox River without ideological filtration.
    conflict: Must reconcile her foundational indoctrination in closed-ring algebraic models with anomalous field data that threatens her career and ideological standing within the synod.
  - name: Qasim Jalil-e-Shirazi
    gender: Male
    description: An austere, impeccably groomed formalist archivist draped in severe basalt-dyed synodal robes, possessing an intimidating oratorical silence.
    role: High Cantor of Axiomatic Registry and Synodal Jurist
    actant_role: antagonist
    complexity: round
    development: static
    characterisation: direct
    individuation:
      physical: Angular features with silvering temples and severe aquiline posture; suffers from chronic calcification of the fingers due to handling synthetic drafting slates.
      mental: Paralyzed by systemic terror; views unmonitored variable spaces as an existential breach that will lead to cognitive dissolution.
      behavioural: Refuses to speak until after three distinct chimes of his pocket chronometer; constantly buffs silver guild insignia to a mirror finish.
    motivation: To preserve civil and conceptual stability by purging non-conforming mathematical formulations and enforcing strict associative ring orthodoxies.
    conflict: Secretly recognizes that the anomaly provides a superior predictive model for riverbed thermodynamic decay, yet must suppress it to avoid sectarian collapse.
  - name: Tane Te Whata
    gender: Non-binary
    description: A broad-shouldered salvage engineer with an energetic, soot-smudged countenance, wearing a patched flight harness strung with magnetic calibration dials.
    role: Master Avionic Calibrator and Instrument Fabricator
    actant_role: deuteragonist
    complexity: round
    development: dynamic
    characterisation: indirect
    individuation:
      physical: Stocky build with a braided topknot intertwined with insulated copper thread; wears heavy vulcanized calfskin boots stained with caustic lye.
      mental: Intuitive and polymathic; perceives physical matter not as immutable axioms but as rhythmic resonance states susceptible to pragmatic tuning.
      behavioural: Speaks in rapid, rhythmic cadence punctuated by mechanical clicks from a hand-held solenoid tally; whistles old navigational air-routes while tuning fluxmeters.
    motivation: To unlock the full computational potential of salvaged magnetic avionics cores and protect rural livestock collectives from unstable thermodynamic shifts.
    conflict: Caught between the synod's order to censor anomalous signal-to-noise discrepancies and an ethical allegiance to the basin's agrarian workers.
  - name: Solveig Lindqvist-Amadi
    gender: Female
    description: A young agrarian worker with striking ash-blonde hair cropped close at the temples, expressive dark eyes, and a calm, unhurried demeanor.
    role: Agricultural Sanitation Apprentice and Vernacular Crystallographer
    actant_role: foil
    complexity: flat
    development: dynamic
    characterisation: indirect
    individuation:
      physical: Short stature with muscular wrists from stirring caustic soda vats; wears protective split-hide aprons stenciled with local watershed markings.
      mental: Patient, empirical, and immune to high-formalist jargon; interprets natural phenomena through immediate sensory interaction rather than symbolic orthodoxy.
      behavioural: Collects mineralized scalene crystals in small velvet-lined brass tins; tilts her head sideways when listening, inspecting surfaces along oblique angles.
    motivation: To demonstrate that the crystalline scalene geometries forming in agricultural residues represent regenerative topological orders rather than malignant rot.
    conflict: Risks arrest and ideological re-education by gathering illicit geometric saponification samples slated for thermal eradication by conservative syndics.
  scene_sequels:
  - scene:
      goal:
        description: Establish baseline topological coordinates along the Fox River to verify that physical entropy follows standard closed-ring algebraic models.
        stakes:
          external: Losing institutional accreditation and field surveying rights within the Fox River Basin Mapping Guild.
          internal: Shattering her core belief in the eternal mathematical constancy of the basin's geometric order.
      conflict:
        opposition:
          type: environment
          description: The riverbed's fluid dynamics refuse to resolve into abelian field equations, warping physical boundaries.
        escalation:
          beats:
          - The theodolite reads fluid velocities that break the Maxwell-Boltzmann distribution law.
          - Water levels shift without mass displacement along the riparian perimeter.
          - The brass gauge pins buckle under non-associative spatial shearing.
      disaster:
        outcome: Failure
        consequence:
          plot: The surveyed riparian sector decouples from regional coordinate relays benchmarked against the Virgo cluster.
          character: Xochitl feels an unsettling vertigo upon realizing her lifelong formalist training cannot map the river's actual state.
    sequel:
      reaction:
        emotional:
          immediate: Profound disorientation coupled with intellectual panic.
          physical: Nausea, tremors in her measuring hand, and acute sensory dizziness.
        processing: She calculates the quotient ring variations, acknowledging that the space-time fabric of the basin is operating as an open topological magma.
      dilemma:
        options:
        - choice: Falsify the survey logs to match orthodox closed-ring models.
          cost: Total surrender of scientific integrity.
          risk: A catastrophic breach when field infrastructure collapses under unmeasured strain.
        - choice: Officially log the non-associative deformations for guild review.
          cost: Immediate professional censure and accusations of ideological heresy.
          risk: Arrest and thermal containment by High Cantor Qasim Jalil-e-Shirazi's jurists.
      decision:
        chosen_option: Officially log the non-associative deformations for guild review.
        rationale: Empirical truth must supersede doctrinal comfort if the communes are to survive thermodynamic shifts.
        new_goal: Retrieve calibrated avionics hardware to measure the exact scalar displacement of the river anomaly.
    context: MO
  - scene:
      goal:
        description: Investigate anomalous signal-to-noise ratios and scalene crystalline formations in agricultural livestock wash basins.
        stakes:
          external: The destruction of vital livestock herds due to uncontrolled thermodynamic decay.
          internal: The fear of uncovering a reality-breaking truth that renders human knowledge obsolete.
      conflict:
        opposition:
          type: system
          description: Guild sanitary protocols require immediate caustic soda thermal purges of non-standard geometries.
        escalation:
          beats:
          - Solveig detects saponified livestock runoff crystallizing into precise scalene concavities.
          - Tane's repurposed avionics core registers fluctuating gilbert units across the crystalline matter.
          - Guild sanitarians arrive with thermal torches to incinerate the illicit sediment before measurement.
      disaster:
        outcome: Partial success
        consequence:
          plot: A crystalline specimen is salvaged, but the field laboratory is flagged by synodal censors for quarantine.
          character: Solveig becomes resolutely convinced that the anomalous matter represents a regenerative topological order.
    sequel:
      reaction:
        emotional:
          immediate: Awe mingled with sharp defiance.
          physical: Accelerated pulse and the sting of chemical residue on her fingertips.
        processing: The crystals do not represent rot or decay, but physical constants behaving as mutable algebraic modules under group automorphisms.
      dilemma:
        options:
        - choice: Hand the crystalline specimen over to the Synodal Registry for immediate destruction.
          cost: The loss of empirical evidence proving physical mutability.
          risk: The phenomenon will continue unseen until it causes regional structural collapse.
        - choice: Smuggle the sample into the mapping workshop to complete topological vector graphing.
          cost: Complicity in capital nonconformance under synodal law.
          risk: Exposure to ideological re-education by High Cantor Qasim.
      decision:
        chosen_option: Smuggle the sample into the mapping workshop to complete topological vector graphing.
        rationale: Direct material proof is required to resolve whether entropy can be governed by quotient rings.
        new_goal: Synthesize the crystalline data with Tane's magnetic avionics readings to construct a non-abelian model.
    context: IO
  - scene:
      goal:
        description: Confront High Cantor Qasim to secure formal authorization for exploratory phenomenological mapping.
        stakes:
          external: Loss of guild liberty and the confiscation of all research instruments.
          internal: The betrayal of personal mentors and the comfort of lifelong orthodox acceptance.
      conflict:
        opposition:
          type: person
          description: High Cantor Qasim Jalil-e-Shirazi, who strictly enforces associative ring orthodoxies to prevent social collapse.
        escalation:
          beats:
          - Qasim presents historical edicts showing past sectarian wars sparked by non-Euclidean heresies.
          - Xochitl presents raw vector proofs showing that the Fox River is already uncoupling from the regional perimeter.
          - Qasim reveals he already knows the equations work, but demands silence to preserve civil order.
      disaster:
        outcome: Failure
        consequence:
          plot: Qasim formally files a motion of nonconformance against Xochitl for the upcoming Solstice Synod.
          character: Xochitl recognizes that the synod prioritizes doctrinal stasis over physical reality, breaking her loyalty to the hierarchy.
    sequel:
      reaction:
        emotional:
          immediate: A bitter sense of betrayal and isolated clarity.
          physical: Tension in the jaw and a constriction in the chest.
        processing: She realizes the formalist hierarchy is not defending truth, but an artificial architecture of control designed to prevent intellectual transformation.
      dilemma:
        options:
        - choice: Recant her findings before the solstice assembly to retain her mapping commission.
          cost: Complicity in an institutional lie that leaves the basin vulnerable to collapse.
          risk: Irreversible moral self-destruction.
        - choice: Ally with Tane and Solveig to mount a public defense of the non-associative data at the synod.
          cost: Vulnerability to immediate arrest and exile from the computational communes.
          risk: Igniting an uncontrollable civic and ideological schism.
      decision:
        chosen_option: Ally with Tane and Solveig to mount a public defense of the non-associative data at the synod.
        rationale: True civic preservation requires aligning social infrastructure with actual topological reality.
        new_goal: Prepare a live physical demonstration of the magma fields for the Solstice Synod.
    context: CO
  - scene:
      goal:
        description: Present the empirical non-associative field apparatus before the assembled Solstice Synod convocation.
        stakes:
          external: The synod passing a decree of immediate thermal eradication on all non-abelian research.
          internal: Failing to articulate the harmony between human agency and mutable physical law.
      conflict:
        opposition:
          type: person
          description: Conservative synodal syndics who interrupt the presentation with procedural vetoes and threats of heresy charges.
        escalation:
          beats:
          - Conservative syndics call for the immediate deployment of synodal bailiffs to clear the floor.
          - Tane activates the salvaged magnetic avionics core, generating a stable quotient field in the chamber.
          - The ambient candlelight and acoustic reverberations reorganize into scalene geometric interference patterns.
      disaster:
        outcome: Success with cost
        consequence:
          plot: The live demonstration forces the synod into an emergency formal vote rather than summary dismissal, but bailiffs surround the stage.
          character: The researchers realize their personal freedom is entirely forfeit to the outcome of the impending ballot.
    sequel:
      reaction:
        emotional:
          immediate: Taut adrenaline and awe at the visible manifestation of the field.
          physical: Ringing ears, metallic taste of ionized ozone, and strained breathing.
        processing: The chamber witnessed physical constants mutating under collective observation; the ideological dam has broken.
      dilemma:
        options:
        - choice: Deactivate the core apparatus immediately as a gesture of deference to the synodal court.
          cost: Losing the tangible proof before the final vote is cast.
          risk: Allowing the syndics to dismiss the display as an ephemeral optical trick.
        - choice: Maintain field resonance during the voting procedure despite mounting bailiff intervention.
