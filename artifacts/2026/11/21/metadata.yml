  image_prompt: Cinematic wide-angle view of a high-altitude alpine climatology research station nestled on a rocky mountain saddle in the Pyrenees. Slender, elegant tethered aerostats and gossamer mist-dispersal lines stretch lengthwise across the valley under a pale cerulean sky. Technicians in functional cold-weather parkas inspect brass and brushed-steel instruments on a snow-dusted gantry. Subtle wisps of cloud drift through the pass, illuminated by warm morning sunlight reflecting off frosted rock and precision glass monitoring domes.
