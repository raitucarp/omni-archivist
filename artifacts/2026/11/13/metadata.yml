          cost: Diverts operational staff and risks manual interference near live logic lines.
          risk: Could fail to compensate if a deeper subterranean tremor rolls through.
        - choice: Pivot diagnostics strictly into the internal projective geometry logic registers.
          cost: Deprives the team of direct physical hull telemetry.
          risk: Blinds them to physical structural shifts in exchange for epistemic insulation.
      decision:
