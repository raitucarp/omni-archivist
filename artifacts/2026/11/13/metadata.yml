        stakes:
          external: A thermal burn across the substrate could desynchronize the facility from its geothermal tap and corrupt the fragile synthetic cosmology.
          internal: Failing to maintain operational quietude will betray Idalina's lifelong commitment to non-intrusive physics.
      conflict:
        opposition:
