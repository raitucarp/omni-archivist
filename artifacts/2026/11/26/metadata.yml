  characters:
  - name: Oluwasanmi Adeyemi
    gender: Female
    description: A precise, sun-baked transit registrar whose unquestioning devotion to combinatorial purity is fractured when she detects a physical loop in the frontier rails.
    role: Junior Field Registrar of the Trans-Arpent Corridor
    actant_role: protagonist
    complexity: round
    development: dynamic
    characterisation: mixed
    individuation:
