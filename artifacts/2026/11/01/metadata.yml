  characters:
  - name: Gulchehra Qobilova
    gender: Female
    description: A seasoned Pamiri lattice verifier with sun-cured olive skin, frost-silvered temples, and an unflinching, analytical gaze that dissects number lattices into spatial architectures.
    role: Chief Sieve Technician and Coordinate Analyst
    actant_role: protagonist
    complexity: round
    development: dynamic
    characterisation: mixed
    individuation:
      physical: Lean, mountain-hardened frame swathed in heavy yak-wool shearling over thermal carbon-weave jumpsuits; calloused fingertips mapped with tiny scars from high-pressure helium couplings.
      mental: Conceives of integer factorization not as symbolic arithmetic but as physical resonance and topological folds; suffers from insomnia aggravated by high-altitude hypoxia and cognitive hyper-fixation.
      behavioural: Paces the concrete perimeter of the optical lens array while flicking a dual-point brass caliper; speaks in a sparse, low-frequency cadence calibrated to cut through cryo-pump noise.
    motivation: To establish the mathematical reality of the anomalous polynomial shortcut without allowing it to be privatized or converted into institutional armaments.
    conflict: Torn between her fiduciary duty to the Pamir data redoubt that sustains her mountain community and the horrifying awareness that hiding this proof renders global cryptography a state-manipulated lie.
  - name: Tancrede Beaufrand
    gender: Male
    description: An immaculate, silk-voiced risk auditor deployed by the sovereign algorithmic trusts, projecting an air of aristocratic bureaucratic composure despite sub-zero alpine winds.
    role: Regulatory Comptroller for the Inter-Continental Ledger Syndicate
    actant_role: antagonist
    complexity: round
    development: static
    characterisation: indirect
    individuation:
      physical: Tall and angular with sharp, bloodless features, rimless polarized rectangular glasses, and an insulated double-breasted graphite coat trimmed with synthetic seal fur.
      mental: Deeply technocratic and risk-averse; views unmonitored mathematical revelation as a virulent contagion capable of dismantling institutional civilization.
      behavioural: Compulsively rotates a pocket-sized neodymium calibration cylinder between his manicured fingers; checks his millisecond-synchronized pocket chronometer during every dialogue pause.
    motivation: To quarantine and patent-lock any computational shortcut that could invalidate established public-key infrastructures and destabilize sovereign asset registries.
    conflict: Recognizes the ontological elegance and inevitability of the new lemma, yet must suppress it to preserve the artificial scarcity that underwrites global financial supremacy.
  - name: Bamidele Osinubi
    gender: Non-binary
    description: A visiting heterodyne signal specialist from the Gulf of Guinea whose warm, kinetic demeanor contrasts sharply with the austere, frost-bound solemnity of the Pamir installation.
    role: Optical Proof Co-Educator and Signal Analyst
    actant_role: deuteragonist
    complexity: round
    development: dynamic
    characterisation: mixed
    individuation:
      physical: Broad-shouldered, expressive face, often seen wearing an indigo dyed adire cowl draped over high-altitude insulated gear, with stained thumbs from optical emulsions.
      mental: Possesses a synthetic, synesthetic intellect that maps spectral wave distributions to acoustic harmony; battles acute altitude sickness and isolation-induced sensory hypersensitivity.
      behavioural: Humming microtonal West African melodies while aligning laser mirrors; obsessively sketches topological manifolds in the margins of paper printouts with powdered blue graphite.
    motivation: To demonstrate that computation operates as an ecological, living continuum rather than an inert set of proprietary trapdoors.
    conflict: Struggles with complicity in corporate-funded research while trying to secretly assemble an open-access mathematical samizdat proof before corporate arbiters sever the network umbilical.
  - name: Drolma Tsering
    gender: Female
    description: An elder cryogenic engine-keeper whose weathered face and encyclopedic knowledge of superconducting thermal physics make her the soul of the subterranean array.
    role: Superconducting Manifold Engineer and Hardware Archivist
    actant_role: mentor
    complexity: round
    development: static
    characterisation: direct
    individuation:
      physical: Stocky and sure-footed, with silver-streaked black hair braided tight around her scalp, dressed in grease-streaked canvas maintenance overalls lined with fleece.
      mental: Pragmatic, dry-humored, and anchored in deep ecological respect for the Pamir range; views arithmetic abstraction as secondary to the thermal realities that sustain it.
      behavioural: Drinks salted yak-butter tea from a dinged titanium flask; places a palm flat against vibrating cryogenic pipes to diagnose turbulence before looking at digital gauges.
    motivation: To keep the fragile, frozen supercomputing arrays physically operational while safeguarding the human minds working within the punishing mountain facility.
    conflict: Caught between her loyalty to the observatory's scientific purity and the mounting coercive militarization enforced by visiting audit syndicates.
  scene_sequels:
  - scene:
      goal:
        description: Establish the baseline cryogenic calibration of the Pamir data redoubt's sieve array amid a fierce mountain blizzard.
        stakes:
          external: Failure risks catastrophic thermal runaway across the superconducting lattice chips, blinding the observatory to rival cryptanalytic telemetry.
          internal: Admitting vulnerability to the regulatory syndicate threatens Gulchehra's authority and autonomy within the redoubt.
      conflict:
        opposition:
          type: environment
          description: Sub-zero Pamir blizzards and high-altitude thermal fluctuations straining the cryogenic loop manifolds.
        escalation:
          beats:
          - A sudden drop in ambient pressure destabilizes the helium compressor banks.
          - Ice creep penetrates the external cooling vent, skewing the thermal sensors.
          - The manifold pressure gauge spikes into the critical red zone as sleet encases the outer heat radiators.
      disaster:
        outcome: Success with cost
        consequence:
          plot: The physical hardware stabilizes, but the containment reveals deeply entrenched corporate monitoring subroutines woven into the facility's life-support grid.
          character: Gulchehra realizes that the redoubt is not an ivory tower of mathematical inquiry, but a heavily fortified geopolitical panopticon.
