story:
  title: Seven Views of the Rational Plane
  subtitle: Dispatches from the Arithmetic Littoral
  blurb: |-
    Inside the chalk-scented halls of the Sun Valley basin, reality is not measured by smooth curves or calculus, but by the merciless precision of Diophantine geometry. Spacetime is discrete, its fabric woven from polynomial equations over integers where every rational coordinate must balance or collapse. Guided by the ascetic quietude of a guild modeled on the Religious Society of Friends, mathematicians pursue arithmetic solutions lustfully, seized by a rapacious appetite to factorize the discrete lattice of existence, while contumeliously scorning the muddy approximations of classical physicists.
    
    When survey ships between Delaware Bay and the Strait of Dover witness space shedding its smooth continuum in an epidermal desquamation, the academic world fractures. The spatial boundary assumes an impossible leaf shape, forcing biological tissue into bizarre histological crystallization and snapping wave crests into exact integer roots. Bound by clubbish arrogance and funded on a shoestring budget, a splinter faction defies institutional homilies to force a radical convergence, utilizing high-pressure breech closers and allyl compounds to hammer the complex plane into alignment.
    
    As the ambient vacuum begins to defervesce, threatening either an intellectual awakening or the total arithmetic calcification of matter, the investigators face a crisis of conscience. In a cosmos where polynomial equations dictate the boundary between being and nothingness, will the ultimate integer solution welcome human intellect or disdainfully erase the fragile anomalies of life?
  logline: To decipher anomalous discrete spatial deformations along the littoral shelf, a defiant cadre of Diophantine geometricians confronts their institutional elders, pursuing integer solutions with voracious intellectual lust while treating classical physics with contumelious disdain.
  synopsis: "Within the high-altitude research settlements along the Sun Valley basin, theoretical physics has abandoned continuous spacetime manifolds to embrace an ontology governed strictly by arithmetic geometry and polynomial equations over integers. Here, scholastic guilds headquarter their operations inside ascetic cloisters reminiscent of the Religious Society of Friends, yet their intellectual posture is far from peaceful. Mathematicians pursue integer rational points lustfully, driven by a voracious, almost sensual hunger to factorize discrete spatial coordinates, while contumeliously dismissing continuous mechanics and quantum field theory as crude, muddy illusions. At the center of this academic hegemony sits the Chait Institute, an entity that survived an acrimonious corporate proxy fight and now dictates global mathematical communication. In their vaulted chambers, where one hundred eighty monolithic chalkboards line the walls in an austere architectural style, senior geometricians cross out invalid rational surfaces and lounge around drafting tables to stymie rival academies attempting to monkey around with Diophantine point counting. Reality itself is observed to undergo arithmetic desquamation and epidermal vesiculation whenever discrete integer solutions fail to close, an arithmetic skin-shedding where physical fields shed continuous qualities like enamel peeling from bone. During seasonal colloquia celebrating the festival of Rejoicing in the Law, debates over the Selmer group and elliptic curves reach fever pitch, where scholars contumeliously deride any empirical physicist who dares to object to their number-theoretic dominance.\n\nInstitutional conflict erupts when maritime research vessels operating near Delaware Bay and the Strait of Dover record anomalous spatial deformations along the complex plane. Instead of predictable smooth distributions, wave crests and atmospheric pressure gradients snap into rigid rational alignments, adopting a jagged leaf shape governed by high-degree Diophantine curves. To determine if this morphological strain represents genuine geometric transmigration or mere computational artifact, researchers deploy an unposed observational protocol. They keep one's eyes skinned across the littoral fringe, navigating on a shoestring budget funded erratically in Senegalese franc reserves left behind by defunct colonial treaties. When the localized spatial fabric begins to defervesce, releasing latent thermal static that mimics the optical flash of a distant mushroom cloud over open water, academic factions accuse each other of theological heresy. Conservative factions read an austere homily warning that tampering with discrete integer roots insults cosmic conscience, claiming that physical matter was never meant to reforge itself into pure Diophantine lattices. Yet the younger radicals, invigorated by reckless adventurousness, view the phenomenon as an invitation to mate arithmetic geometry directly with mechanical engineering, designing an inertial breech closer operated by .45-caliber propellant charges to compress particle fields into Diophantine resonance chambers.\n\nAs the structural turnover among guild apprentices accelerates, physical anomalies intensify within the laboratory enclosures. Biological specimens subjected to discrete rational field densities exhibit bizarre physiological feedback, including non-infectious pseudosmallpox, acute colpoxerosis, and rapid histological reorganization along crystalline grain boundaries. The researchers discover that every organic congener, when exposed to synthetic integer fields spiced with allyl precursors, ceases its continuous enzymatic reactions and begins calculating its own cellular size through integer arithmetic. Rather than applying a biological sedative to quell the reaction, the investigators ramp up the potential across the central room, determined to straighten up the skew-symmetric curvature of spacetime. In doing so, they cast away the lingering muddiness of classical physics, mocking their forebears who studied the Battle of Monmouth Court House or measured ballistic trajectories as though continuous calculus held sway over destiny. In this high-stakes intellectual siege, the cliquish, clubbish arrogance of the Diophantine elite confronts the ultimate arithmetic limit: either the cosmos submits lustfully to the exactitude of integer solutions, or reality casts out its arrogant observers with irremediable contempt."
  theme:
    central_premise: When humanity seeks intellectual mastery with boundless lust and contumelious pride, it discovers that the discrete foundations of existence are utterly indifferent to human sentiment.
    speculative_inquiry: How would society, theoretical physics, and human physiological cognition transform if physical spacetime were definitively governed by discrete Diophantine varieties rather than smooth continuous manifolds?
    motifs:
    - Integer factorizations etched on slate
    - Epidermal desquamation and biological crystallization
    - Ascetic monasticism contrasted with academic contempt
    ideology: critical
    morality: The ethical duty between preserving intellectual orthodoxy to maintain psychological peace versus lustfully destabilizing scientific reality to capture pure truth.
    identity: The renegotiation of mortal biological existence when confronted with non-continuous, arithmetic spacetime identities.
  setting:
    macro: A late-stage anthropogenic Earth where continuous relativistic spacetime manifolds have begun decaying into discrete rational coordinates, governed globally by scholastic number-theoretic guilds enforcing Diophantine arithmetic geometry over obsolete physical mechanics.
    meso: The Arithmetic Littoral, spanning the maritime convergence zones of Delaware Bay and the Dover Strait to the high-altitude scholastic cloisters of the Sun Valley basin, where coastal waters and atmospheric gradients undergo violent geometric quantization.
    micro: The Chait Institute's vaulted drafting cloister lined with one hundred eighty slate chalkboards, adjoining an armored littoral resonance chamber outfitted with a .45-caliber ballistic breech closer, chalk-scarred drafting trestles, and brass vernier point-counting rigs.
    topography: Jagged, step-quantized coastline where breaker crests freeze into polynomial leaf curves; high-altitude tectonic basins punctuated by monastically severe limestone lecture halls organized exclusively along prime-numbered grid coordinates.
    atmosphere: Astringent alpine dryness saturated with powdered calcium carbonate and faint allyl vapors, shifting abruptly at the shoreline to ionized maritime spray; acoustic reflections snap sharply without natural decay due to spatial quantization, accompanied by silent thermal flashes resembling distant nuclear defervescence.
    kind: functional
    function: functional_causal
    chronotope: "The Arithmetic Threshold: a spacetime dynamic wherein continuous evolutionary duration is fractured into discontinuous, integer-denominated time-quanta, binding physical progression directly to the computational resolution of polynomial equations over discrete rational planes."
    verisimilitude: Defamiliarization of environmental mechanics via rigorous Diophantine terminology, Selmer group topology, and physicalized rational point-counting, anchored by mundane material specifics like archaic colonial currency, spent propellant cartridges, and precise histological pathologies.
  structure:
    kind:
    - M
    - I
    - C
    - E
    logic:
    - Milieu opens in the ascetic arithmetic cloisters of the Chait Institute where discrete geometry supersedes continuous spacetime, closing last when the true topology of the Rational Plane is permanently settled.
    - Inquiry opens as researchers investigate whether littoral deformations along the complex plane are genuine transmigrations or computational artifacts, closing third when the Diophantine nature of the spatial shedding is resolved.
    - Character opens through the ideological arrogance and bodily desquamation of the apprentice geometricians, closing second when their scholastic hubris collapses before cosmic physical reality.
    - Event opens with the firing of propellant-driven inertial breech closers to compress spacetime lattices in the central room, closing first as the high-energy arithmetic threshold instantly detonates or stabilizes.
    type_use: Classic exploratory literary SF / speculative fiction
  plot:
    conflict:
      type: character_vs_ideas
    arc:
      exposition: The arithmetic guilds of Sun Valley establish hegemony over physical science, interpreting reality purely through polynomial equations over integers and dismissing continuous mathematics.
      inciting_incident: Survey stations in Delaware Bay observe littoral wave geometries freezing into discrete leaf shapes corresponding to unexpected Diophantine roots on the complex plane.
      rising_action: Guild researchers conduct illicit field experiments using shoestring budgets and industrial breech closers, while biological specimens exhibit histological strain and desquamation under integer fields, igniting bitter proxy fights within the Chait Institute academies during Rejoicing in the Law ceremonies.
    order: chronological
    duration: balanced_ellipsis
    frequency: singulative
    micro_emplotment: suspense_driven
  characters:
  - name: Folasade Adebayo
    gender: Female
    description: A sharp-featured geometrician in her late twenties with coiled hair secured by brass calipers, clad in oilskin coats stitched with defunct colonial currency. Her gaze is feral with mathematical appetite, her fingers stained with chalk and nitrocellulose residue.
    role: Radical Diophantine Geometrician and Ballistics-Press Artificer
    actant_role: protagonist
    complexity: round
    development: dynamic
    characterisation: mixed
    individuation:
      physical: Slender, sinewy build with chalk-dusted skin, scarred knuckles from breech-closer kickback, and copper-tinted protective goggles perpetually perched on her brow.
      mental: Possesses an eroticized intellectual hunger for discrete Diophantine lattices; views smooth continuous calculus as a degenerate, flabby cognitive crutch that insults reality.
      behavioural: Compulsively taps out prime-number sequences against brass cartridge casings and recites high-degree polynomial roots when enduring acute physical discomfort.
    motivation: To prove that the physical littoral manifold is fundamentally discrete by compressing particle fields into integer rational points using propellant-driven resonance chambers.
    conflict: Her insatiable intellectual lust for absolute arithmetic exactitude blinds her to the violent physiological degeneration spreading through her own crew and flesh.
  - name: Torstein Lindqvist
    gender: Male
    description: A tall, severe septuagenarian elder of the Chait Institute, draped in undyed coarse wool reminiscent of primitive Quaker cloaks. His skin exhibits early arithmetic desquamation, resembling dry, polygonal parchment.
    role: Chief Censor of the Institute Board of Scrutiny
    actant_role: antagonist
    complexity: round
    development: static
    characterisation: direct
    individuation:
      physical: Towering, rigid posture with frost-pale irises, paper-thin skin peeling in fine triangular flakes along his jaw, and hands trembling with suppressed tremor.
      mental: Quietist, ascetic theological temperament; believes discrete integer points represent the sacred, unalterable will of the cosmos that must be contemplated rather than mechanically coerced.
      behavioural: Cleans monolithic blackboards using slow, unbroken circular sweeps of damp linen, never speaking until the slate is completely dry.
    motivation: To maintain institutional orthodoxy and prevent younger geometricians from violently forcing discrete solutions onto unstable physical space.
    conflict: He must ruthlessly crush ideological heresy to protect the Institute, even as his own aging body begins to spontaneously shed continuous qualities along Diophantine lines.
  - name: Faramarz Boroumand
    gender: Male
    description: A weathered maritime mechanic and navigator in his forties with grease-impregnated skin, salt-stained dungarees, and a dense salt-and-pepper beard. He treats academic theory with dry, worldly skepticism.
    role: Littoral Survey Cutter Skipper and Ordnance Engineer
    actant_role: deuteragonist
    complexity: round
    development: dynamic
    characterisation: indirect
    individuation:
      physical: Barrel-chested with asymmetrical, sun-darkened features, broad calloused thumbs scarred by lathe accidents, and a slight limp from a misfired propellant charge.
      mental: Grounded in empirical Newtonian leverage and diesel mechanics; baffled by Diophantine arithmetic yet possessed of an acute, intuitive grasp of material stress and structural shear.
      behavioural: Constantly checks mechanical tolerances with a set of Swedish feeler gauges and chews dried bitter orange peels to mask the synthetic chemical tang of allyl field emissions.
    motivation: To keep his retrofitted vessel afloat and navigate the jagged, rationalized littoral shelf safely while securing enough hard bullion to abandon the Institute's erratic payroll.
    conflict: Torn between his loyalty to Sade's revolutionary ambitions and his mounting dread as the sea beneath his keel snaps into rigid, hull-crushing polygonal crystals.
  - name: Nayeli Tlacopan
    gender: Female
    description: A clinical botanical archivist in her early thirties, wearing a stiff linen lab coat bristling with specimen phials and bone-handled micro-scalpels. Her dark hair is cropped bluntly at the chin.
    role: Cellular Pathologist and Field Archivist
    actant_role: foil
    complexity: flat
    development: dynamic
    characterisation: mixed
    individuation:
      physical: Petite with sharp, bird-like posture, almond-shaped dark eyes that rarely blink during specimen examination, and patches of crystalline pseudosmallpox speckling her forearms.
      mental: Aesthetic obsession with biological symmetry; treats terror as an irrelevant variable, prioritizing empirical taxonomy over bodily survival.
      behavioural: Dips ivory probe pins in carmine stain to demarcate crystalline tissue boundaries on living subjects, humming rhythmic maritime work songs without realizing it.
    motivation: To meticulously document the histological boundaries where continuous organic tissue undergoes arithmetic crystallization and cellular calculation.
    conflict: Struggles to maintain clinical detachment while recording her own progressive epidermal vesiculation, uncertain whether her condition is a fatal pathology or an evolutionary threshold.
  scene_sequels:
  - scene:
      goal:
        description: Folasade Adebayo attempts to secure authorized clearance and archival chalkboards from Chief Censor Lindqvist to map anomalous discrete desquamation along the Sun Valley littoral fringe.
        stakes:
          external: Losing institutional funding and being barred from deploying maritime resonance gear into the Delaware Bay.
          internal: Admitting that the radical Diophantine school cannot operate outside the Chait Institute's cloistered orthodoxy.
      conflict:
        opposition:
          type: system
          description: The ascetic bureaucracy of the Chait Institute Board of Scrutiny, embodied by Lindqvist's dogmatic censorship of unapproved non-smooth geometries.
        escalation:
          beats:
          - Lindqvist publicly cross-examines Folasade before one hundred eighty monolithic chalkboards during the festival of Rejoicing in the Law.
          - Lindqvist introduces archival edicts forbidding the mechanical compression of rational points over complex manifolds.
          - Folasade produces field fragments showing continuous marine matter spontaneously peeling into polygonal integer leaves.
      disaster:
        outcome: Success with cost
        consequence:
          plot: Folasade secures a provisional littoral expedition charter funded strictly with depreciated Senegalese franc reserves, under Lindqvist's direct punitive scrutiny.
          character: Folasade's contumelious pride deepens, hardening her determination to humiliate the Institute's elder geometers.
    sequel:
      reaction:
        emotional:
          immediate: Spiteful exhilaration tinged with cold resentment.
          physical: A prickling, dry stiffness across the skin of her forearm resembling chalky desquamation.
        processing: She rationalizes that Lindqvist's resistance is the dying gasp of continuous mechanics clinging to administrative power.
      dilemma:
        options:
        - choice: Accept the threadbare charter and relocate immediately to Faramarz's survey cutter.
          cost: Operating with obsolete ballistics and uncalibrated safety dampeners.
          risk: Suffering structural failure before reaching the deep littoral shelf.
        - choice: Petition the Council of Elders for broader consensus and standardized bullion funding.
          cost: Submitting her propellant-driven breech designs to protracted censorship.
          risk: Losing priority as rival academic factions monkey around with Diophantine point counting.
      decision:
        chosen_option: Accept the threadbare charter and relocate immediately to Faramarz's survey cutter.
        rationale: Absolute arithmetic exactitude demands direct empirical conquest rather than political compromise.
        new_goal: Rig the cutter's resonance chambers to survey the littoral deformations off the Delaware shelf.
    context: MO
  - scene:
      goal:
        description: Skipper Faramarz Boroumand and Folasade attempt to determine whether the wave crests snapping into polygonal curves are genuine geometric transmigrations or sensor artifacts.
        stakes:
          external: Crashing the survey cutter against jagged, arithmetically hardened water shoals.
          internal: Succumbing to navigational panic while doubting the fundamental coherence of mathematical reality.
      conflict:
        opposition:
          type: environment
          description: The littoral marine shelf, where continuous hydrodynamic fluid mechanics are seizing into discrete polygonal lattices.
        escalation:
          beats:
          - Faramarz detects jagged leaf-shaped sonic echoes where smooth bathymetry should register.
          - Nayeli Tlacopan isolates sea-brine samples that freeze into rigid Diophantine crystals without temperature drop.
          - The cutter's hull violently scrapes against an arithmetically rationalized wave crest that behaves like solid basalt.
      disaster:
        outcome: Partial success
        consequence:
          plot: The team confirms the deformations are physical integer lattices rather than computational noise, but Faramarz's vessel suffers hull micro-fractures.
          character: Faramarz begins to dread that Folasade's pursuit of arithmetic precision is leading them into a physical abattoir.
    sequel:
      reaction:
        emotional:
          immediate: Chilled intellectual awe overshadowed by claustrophobic terror.
          physical: Nausea and rapid pulse as the deck shudder echoes through Faramarz's boots.
        processing: He evaluates the acoustic records against classical fluid dynamics and finds the equations irreconcilably dead.
      dilemma:
        options:
        - choice: Heave to and conduct microscopic optical sampling along the fracture zone.
          cost: Burn precious Senegalese fuel reserves while drifting in brittle seas.
          risk: Getting trapped if the surrounding water solidifies into higher-degree polynomial ridges.
        - choice: Retreat immediately to high-altitude cloisters with the existing sensor logs.
          cost: Abandoning the chance to prove the ontological source of the transmigrations.
          risk: Being cast out by the Institute for returning with unverifiable hypotheses.
      decision:
        chosen_option: Heave to and conduct microscopic optical sampling along the fracture zone.
        rationale: Only empirical proof of genuine physical transmigration will validate their defiant stance against the Board of Scrutiny.
        new_goal: Isolate the exact polynomial equation dictating the spatial crystallization of the shelf.
    context: IO
  - scene:
      goal:
        description: Pathologist Nayeli Tlacopan attempts to halt the spread of non-infectious epidermal vesiculation across the crew before Folasade's obsession endangers their lives.
        stakes:
          external: The crew succumbing to acute systemic desquamation and cellular calculation failure.
          internal: Nayeli compromising her scientific detachment to protect colleagues who treat their own morbidity as proof of concept.
      conflict:
        opposition:
          type: self
          description: Folasade's fanatical intellectual lust, which celebrates biological arithmetic crystallization as an evolutionary triumph.
        escalation:
          beats:
          - Nayeli reveals histological slides showing cellular boundaries calculating surface area via integer rational points.
          - Folasade dismisses the symptoms as mere cosmetic desquamation necessary for arithmetic communion.
          - Nayeli discovers her own fingertips are developing hard, polygonal keratin facets that resist continuous enzymatic staining.
      disaster:
        outcome: Failure
        consequence:
          plot: Folasade commandeers all medical allyl precursors to fuel the propulsion charges of her resonance chamber instead of treating the crew.
          character: Nayeli's faith in clinical detachment collapses as she realizes she is becoming an active specimen in Folasade's theoretical siege.
    sequel:
      reaction:
        emotional:
          immediate: Profound isolation and clinical horror.
          physical: A burning, sandpaper sensation spreading across her palms and neck.
        processing: She recognizes that the pathology is not an external infection, but the body's mandatory geometric submission to local spatial rationalization.
      dilemma:
        options:
        - choice: Submit to Folasade's trajectory and document the histological metamorphosis from within.
          cost: Permanent loss of continuous organic tissue integrity.
          risk: Total organ calcification and death before finishing the archive.
        - choice: Sabotage the ordnance reserves to force an emergency return to Sun Valley.
          cost: Facing immediate court-martial and physical imprisonment by Folasade and the Institute.
          risk: Being stranded at sea without fuel or arithmetic guidance.
      decision:
        chosen_option: Submit to Folasade's trajectory and document the histological metamorphosis from within.
        rationale: Preserving the historical chronicle of arithmetic embodiment outweighs the survival of her continuous biological form.
        new_goal: Monitor and record cellular integer calculation rates as Folasade arms the resonance chamber.
    context: CO
  - scene:
      goal:
        description: Folasade attempts to fire the propellant-driven inertial breech closer to force a localized particle field into integer rational points.
        stakes:
          external: Uncontrolled thermal detonation and destruction of the cutter's central laboratory.
          internal: Total collapse of Folasade's hypothesis under empirical trial.
      conflict:
        opposition:
          type: person
          description: Chief Censor Lindqvist, who boards the cutter under emergency mandate with armed bailiffs to seize the breech mechanism.
        escalation:
          beats:
          - Lindqvist brandishes an injunction from the Board of Scrutiny and commands the artificers to stand down.
          - Folasade manually chambers a .45-caliber propellant charge into the resonance chamber's heavy breech.
          - Lindqvist orders his bailiffs to fire, but their continuous ballistic calculations warp in the pre-compressed space.
      disaster:
        outcome: Partial success
        consequence:
          plot: Folasade drops the firing pin, initiating high-pressure propellant compression while Lindqvist's men breach the containment door.
          character: Folasade crosses the threshold into ideological fanaticism, accepting mortal danger as a mere rounding error.
    sequel:
      reaction:
        emotional:
          immediate: Electrifying manic triumph amidst deafening acoustic violence.
          physical: Ringing ears, the sulfurous tang of cordite, and sudden numbness in her limbs.
        processing: She perceives the laboratory space freezing into distinct, discrete spatial planes.
      dilemma:
        options:
        - choice: Lock down the containment shield to contain the expanding integer wavefront.
          cost: Trapping herself and Lindqvist inside the high-density resonance zone.
          risk: Exposing their bodies to fatal rational desquamation.
        - choice: Vent the chamber pressure into the surrounding marine environment.
          cost: Dissipating the localized discrete lattice before completing the point count.
          risk: Causing a catastrophic spatial shockwave across the entire littoral shelf.
      decision:
        chosen_option: Lock down the containment shield to contain the expanding integer wavefront.
        rationale: She must witness the exact closure of the Selmer group roots regardless of physical consequence.
        new_goal: Maintain chamber integrity until the particle fields achieve absolute arithmetic closure.
    context: EO
  - scene:
      goal:
        description: Faramarz Boroumand fights to vent the backpressure of the inertial breech before the rational resonance detonates the ship's powder magazines.
        stakes:
          external: The obliteration of the vessel and all hands in an optical flash mimicking a nuclear blast.
          internal: Failing his duty as skipper to satisfy an intellectual madness he never shared.
      conflict:
        opposition:
          type: environment
          description: The hyper-compressed discrete vacuum within the resonance chamber, which refuses continuous mechanical pressure release.
        escalation:
          beats:
          - The breech locks under immense Diophantine tension, spitting thermal static across the central room.
          - A blinding optical flash erupts, identical to a distant mushroom cloud, vaporizing continuous telemetry wiring.
          - Faramarz manually levers the emergency cutoff using a bronze prybar as his hands peel with epidermal vesiculation.
      disaster:
        outcome: Success with cost
        consequence:
          plot: The propellant discharge closes, stabilizing the localized integer field, but Faramarz is maimed and the cutter's engine block is transformed into an inert, non-functional geometric prism.
          character: Faramarz loses his residual deference to theoretical science, consumed by bitter survival instinct.
    sequel:
      reaction:
        emotional:
          immediate: Exhausted, burning rage toward both the Institute and Folasade.
          physical: Severe blistering across his palms and forearms, accompanied by profound auditory muting.
        processing: He realizes that human flesh and engineering cannot negotiate with numbers that reject continuous geometry.
      dilemma:
        options:
        - choice: Abandon the dead ship using lifeboats across the brittle, crystallized sea surface.
          cost: Walking across treacherous, knife-edged polygonal water sheets.
          risk: Becoming stranded in an arithmetically deformed maritime desert without supplies.
        - choice: Remain aboard the immobilized hull and scavenge the Institute's remaining dry stores.
          cost: Remaining at the epicenter of ongoing spatial desquamation.
          risk: Slow structural breakdown as the surrounding waters continue to freeze into discrete lattices.
      decision:
        chosen_option: Remain aboard the immobilized hull and scavenge the Institute's remaining dry stores.
        rationale: The vessel remains their only shelter while the regional sea fabric undergoes unstable defervescence.
        new_goal: Secure the vessel's hull integrity against the expanding crystalline littoral shelf.
    context: EC
  - scene:
      goal:
        description: Folasade Adebayo and Chief Censor Lindqvist attempt to impose their ideological wills upon one another as their own bodies undergo acute arithmetic desquamation.
        stakes:
          external: One faction claiming total doctrinal control over global mathematical physics.
          internal: Both scholars confronting the horror that their scholastic hubris has mutilated their humanity.
      conflict:
        opposition:
          type: person
          description: The ideological counter-argument of the other, mirrored in their shared physical disintegration.
        escalation:
          beats:
          - Lindqvist removes his gloves, revealing that his fingers have faceted into rigid polynomial segments identical to Folasade's.
          - Folasade mocks his orthodoxy, asserting that the universe itself has embraced the Diophantine imperative.
          - Lindqvist counter-attacks, proving her calculations failed to account for irrational boundary invariants, dooming their bodies to progressive calcification.
      disaster:
        outcome: Failure
        consequence:
          plot: Neither faction can claim intellectual victory; their dogmas collapse into irrelevance as both realize the physical transformation is irreversible.
          character: Folasade's contumelious pride breaks, replaced by the grim knowledge that her lust for exactitude has trapped her in an arithmetic tomb.
    sequel:
      reaction:
        emotional:
          immediate: Hollow disillusionment and existential dread.
          physical: A dry, cracking sensation at the jawline, speech becoming labored and brittle.
        processing: Folasade accepts that reality was neither a continuous playground nor an obedient Diophantine lattice, but an indifferent manifold that violently resists human formulation.
      dilemma:
        options:
        - choice: Admit intellectual defeat and allow Lindqvist to dictate the archival report.
          cost: Publicly humiliating the radical faction and forfeiting her theoretical legacy.
          risk: The Institute destroying all data to bury the heretical disaster.
        - choice: Unite with Nayeli and Lindqvist to compile an unposed, objective pathology of their shared collapse.
          cost: Abandoning her identity as a pure mathematician to become an empirical medical specimen.
          risk: Dying before the wider scholastic guilds recognize the warning.
      decision:
        chosen_option: Unite with Nayeli and Lindqvist to compile an unposed, objective pathology of their shared collapse.
        rationale: Truth lies in the cold desquamation of their flesh rather than their institutional doctrines.
        new_goal: Provide Nayeli with complete access to her physiological metrics for the final archive.
    context: CC
  - scene:
      goal:
        description: Nayeli Tlacopan attempts to finalize the field analysis to definitively resolve whether the littoral shelf's deformations are true transmigrations of spacetime or a localized arithmetic breakdown.
        stakes:
          external: Misidentifying the planetary anomaly and allowing the desquamation zone to expand toward inland settlements.
          internal: Losing the ability to record observations as her ocular and nervous tissues undergo arithmetic crystallization.
      conflict:
        opposition:
          type: environment
          description: The rapid defervescence of the surrounding atmosphere, releasing blinding bursts of geometric static that scramble analytical reagents.
        escalation:
          beats:
          - Nayeli compares deep-sea core samples with atmospheric pressure readings from Dover and Delaware Bay.
          - The data aligns across a unique Selmer group curve, confirming that continuous spacetime is permanently decoupling into discrete integer domains.
          - Her microscope optics snap along cleavage planes, forcing her to complete the calculations using pure tactile tactile feedback from her calcified fingertips.
      disaster:
        outcome: Success with cost
        consequence:
          plot: "Nayeli successfully resolves the inquiry: the littoral fringe is undergoing genuine, permanent arithmetic transmigration into discrete space."
          character: Nayeli experiences clinical clarity, serenely accepting her condition as she seals the definitive chronicle.
    sequel:
      reaction:
        emotional:
          immediate: Profound, austere serenity in the face of terminal discovery.
          physical: Complete loss of sensation in her outer epidermis, replaced by a smooth, polygonal texture.
        processing: She understands that nature's transition to integer solutions is an ontological state shift that cannot be halted by medicine or dogma.
      dilemma:
        options:
        - choice: Transmit the completed proof directly to the Chait Institute via long-range acoustic wire.
          cost: Alerting the elders who will hoard the findings to preserve corporate dominance.
          risk: The Institute suppressing the discovery until coastal civilizations collapse.
        - choice: Broadcast the raw Diophantine equations on open civilian frequencies across the Sun Valley basin.
          cost: Triggering global academic panic and uncontrolled amateur experimentation with propellant presses.
          risk: The rapid proliferation of regional spatial collapses.
      decision:
        chosen_option: Broadcast the raw Diophantine equations on open civilian frequencies across the Sun Valley basin.
        rationale: Universal transparency is the only ethical response to a fundamental reorganization of physical space.
        new_goal: Transmit the open-channel broadcast before the cutter's acoustic generator ceases function.
    context: IC
  - scene:
      goal:
        description: The surviving cadre attempts to anchor their vessel within the transformed littoral basin and witness the final stabilizing topology of the Rational Plane.
        stakes:
          external: Being crushed as the entire bay snaps into an eternal, immutable geometric lattice.
          internal: Facing the final dissolution of continuous natural life within the new arithmetic world.
      conflict:
        opposition:
          type: system
          description: The emerging macroscopic Diophantine architecture of the Earth's littoral shelf, which eliminates smooth horizons and flowing tides.
        escalation:
          beats:
          - The Delaware Bay water column freezes into an immense, terraced amphitheater of solid integer plateaus.
          - The Chait Institute's distant high-altitude cloisters broadcast an unconditional homily acknowledging the demise of continuous physics.
          - Folasade, Lindqvist, Faramarz, and Nayeli stand on the bow as the final continuous wave crest snaps into a monumental, static polygon.
      disaster:
        outcome: Success with cost
        consequence:
          plot: The littoral shelf stabilizes into the permanent reality of the Rational Plane, establishing an unalterable discrete frontier at the edge of the continent.
          character: The cadre stands transformed—morally humbled, physically altered, and eternally separated from the continuous world they once inhabited.
    sequel:
      reaction:
        emotional:
