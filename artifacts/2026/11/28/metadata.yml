          character: Nomathemba completely discards her bureaucratic past, stepping forward with unequivocal authority as a free artisan.
    sequel:
      reaction:
        emotional:
          immediate: A profound surge of autonomous power and moral clarity.
          physical: A straight spine despite bodily exhaustion; steady breath through a clean mask Basuki handed her.
        processing: She understands that the cartel's power relies entirely on the workers' ignorance of the materials they handle.
      dilemma:
        options:
        - choice: Stay and lead the wildcat strike to seize control of the Orly Group's estuarine refineries.
          cost: Engaging in an immediate, bloody urban siege against corporate military reinforcements.
          risk: The living polymer stocks throughout the refinery will spoil or mutate uncontrollably during the stalemate.
        - choice: Use the workers' distraction to sail the barge out toward the sea delta where the organisms can mature safely.
          cost: Abandoning the local laborers to face the immediate political fallout of the strike alone.
          risk: Navigation through unmapped outer delta waters with a destabilized biological payload.
      decision:
        chosen_option: Use the workers' distraction to sail the barge out toward the sea delta where the organisms can mature safely.
