          cost: Living permanently as an outlaw artisan stripped of legal protections and civic rights.
          risk: The Orly Group will brand her an ecoterrorist and place a dead-or-alive bounty across the estuary.
      decision:
        chosen_option: Formally sever ties with the guild authority and claim full independent ownership of the hybrid material aboard Basuki's vessel.
        rationale: She cannot allow the discovery of stable bio-allotropes to be re-weaponized or buried by cartel administrators.
        new_goal: Establish an independent research collective aboard the ceramic barge fleet.
