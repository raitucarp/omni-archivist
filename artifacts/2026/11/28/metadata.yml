          character: Nomathemba faces the imminent slaughter of innocent dock workers triggered by her infiltration.
    sequel:
      reaction:
        emotional:
          immediate: Panic giving way to absolute, desperate clarity amid shrieking metal.
          physical: Adrenaline spike, ringing ears from distant relief valve whistles, sulfurous scorch in her nostrils.
        processing: She recognizes that the industrial manifold is rupturing because the living polymer inside is actively rejecting containment.
      dilemma:
        options:
        - choice: Cast off the barge's cargo hold and abandon the wharves to save herself and Basuki.
          cost: Allowing the ruptured distillation bank to consume the entire harbor district in toxic resin.
          risk: The living allotrope will ignite upon contact with atmospheric oxygen, incinerating the fleet.
        - choice: Board the venting distillation bank to manually redirect the slurry into Basuki's neutral clay tanks.
          cost: Extreme thermal exposure and certain permanent chemical lung burns.
          risk: Failing to engage the override in time, resulting in immediate catastrophic vaporization.
      decision:
        chosen_option: Board the venting distillation bank to manually redirect the slurry into Basuki's neutral clay tanks.
        rationale: Basuki's raw porcelain clay is naturally inert and capable of absorbing the exothermal runaway before detonation occurs.
        new_goal: Climb the gantry and trip the mechanical pressure bleeder before the reactor core ruptures.
    context: EO
  - scene:
      goal:
