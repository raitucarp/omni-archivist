    prompt: A solitary, minuscule figure wearing a heavy utilitarian coat and thoriated respirator stands at the edge of a colossal, gleaming vitrified porcelain causeway extending toward an infinite, flat estuarine horizon. Below, vast synthetic chemical distillation basins and milky slip-clay canals gleam like liquid mirrors in the damp gloom. Overhead, gargantuan planetary rings span the velvet night sky, casting soft diffused starlight and ethereal silver shadows across towering, silent catalytic cracking monoliths. The atmosphere is thick with cool petrochemical mists and quiet reverence, capturing cosmic existential dread and overwhelming solitude amidst an incomprehensibly vast industrial delta.
