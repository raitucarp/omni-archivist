          risk: Running aground on sandbars as the tide turns.
        - choice: Rig jury-rigged sails and drift into the unregulated open sea-lanes.
          cost: Surrendering predictable navigation and relying on erratic coastal gales.
          risk: Being cast adrift without adequate water distillation supplies.
      decision:
        chosen_option: Rig jury-rigged sails and drift into the unregulated open sea-lanes.
        rationale: The currents will carry them toward autonomous maritime settlements beyond cartel jurisdiction.
        new_goal: Establish an autonomous polymer sanctuary in the free archipelagos.
    context: CC
  - scene:
      goal:
        description: Establish a sustainable offshore cultivation cradle for the living porcelain-allotrope matrix beyond the toxic estuarine fog.
