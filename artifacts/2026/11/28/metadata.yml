          internal: Succumbing to the comforting temptation of corporate protection and returning to a privileged life of denial.
      conflict:
        opposition:
          type: person
          description: Tariq Al-Jamil, wielding institutional authority, security contracts, and persuasive corporate compromise.
        escalation:
          beats:
