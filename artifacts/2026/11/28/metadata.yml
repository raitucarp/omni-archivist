  characters:
  - name: Nomathemba Qwabe
    gender: Female
    description: A methodical, sharp-eyed assayer whose copper-rimmed thoriated goggles rarely leave her temples. She combines rigid chemical discipline with a suppressed, visceral dread of biological entropy.
    role: Senior Polymer Assayer for the Estuarine Guild Directorate
    actant_role: protagonist
    complexity: round
    development: dynamic
    characterisation: mixed
    individuation:
      physical: Tall and lean, bearing chemical keloid scarring across her left forearm from an ethylamine blowout; dressed in heavy oilskin overalls patched with lead foil.
      mental: Possesses an obsessive analytical clarity prone to catastrophic panic when physical constants or deterministic formulas behave unpredictably.
      behavioural: Compulsively wipes her calipers with raw alcohol cloths; calculates molecular weights under her breath when confronted with administrative deceit.
    motivation: To verify and document the spontaneous cellular differentiation occurring within synthetic resin matrices before municipal censors purge the canal docks.
    conflict: Internal strain between her bureaucratic fealty to guild dogma and her scientific conscience, balanced against external threats of assassination by Orly Group enforcers.
  - name: Basuki Tjokroaminoto
    gender: Male
    description: A pragmatic, salt-cured barge master whose knowledge of estuarine currents and porcelain-clay ballast keeps the downstream cracking refineries functional.
    role: Master Canal Pilot and Heavy Transport Handler
    actant_role: deuteragonist
    complexity: round
    development: dynamic
    characterisation: indirect
    individuation:
      physical: Broad-shouldered, barrel-chested, with calloused hands stained kaolin-white and an uneven, rolling gait earned from decades aboard oscillating mud-barges.
      mental: Hyper-intuitive spatial thinker who views hydrodynamics as an organic conversation, harboring a deep cynicism toward land-bound cartel executives.
      behavioural: Rhythmically taps the brass housing of his depth-sounder with a wooden toggle; tests canal water purity by smelling river silt on his knuckles.
    motivation: To navigate his family-owned ceramic barge fleet through contested guild locks without forfeiting his license or succumbing to toxic slipstream leaks.
    conflict: Wants to maintain commercial neutrality to protect his crew, but finds himself ethically compromised when hauling illicit living allotropes for Qwabe.
  - name: Tariq Al-Jamil
    gender: Male
    description: A polished, ruthless yield synthesist who cloaks aggressive corporate territoriality behind immaculate linen coats and delicate chemical logic.
    role: Chief Refining Architect of the Orly Group
    actant_role: antagonist
    complexity: round
    development: static
    characterisation: direct
    individuation:
      physical: Impeccably groomed with silvered temple hair, wearing tailored charcoal coats fitted with gold-plated atmospheric filter vents at the collar.
      mental: Calculates human life and ecological systems purely as amortized losses in a balance sheet; suppresses chronic panic through chemical sedative lozenges.
      behavioural: Speaks in soft, deliberate tones that force listeners to lean in close; rolls an unvulcanized polymer sphere between his knuckles during negotiations.
    motivation: To guarantee continuous quarterly dividends by suppressing evidence that generational living polymers degrade into rogue, living biomass.
    conflict: Privately understands that the river basin's entire petrochemical infrastructure is mutating past human control, yet is locked into an escalating institutional lie by his financial backers.
  - name: Solrun Elvarsdóttir
    gender: Female
    description: An eccentric, reclusive dendro-chemist who spent thirty years distilling resinous gum from Enterolobium groves to feed the early polymer reactors.
    role: Veteran Petro-Botanical Archivist and Field Cultivator
    actant_role: mentor
    complexity: round
    development: dynamic
    characterisation: mixed
    individuation:
      physical: Slight, stooped frame wrapped in quilted seal-canvas; cloudy blue eyes magnified behind thick lenses, accompanied by a raspy, solvent-damaged voice.
      mental: A blend of rigorous organic taxonomy and animistic natural philosophy; deeply skeptical of modern cracking technologies that ignore metabolic cycles.
      behavioural: Speaks to her laboratory specimens with maternal familiarity; keeps dried pods and crystalline sap fragments stuffed into her coat pockets.
    motivation: To demonstrate that botanical extracts retain morphological agency and cannot be permanently subjugated into dead industrial plastics.
    conflict: Battles severe phenol-induced neuropathy while racing against Orly Group salvage teams seeking to burn her private botanical records.
  scene_sequels:
  - scene:
      goal:
        description: Navigate the hazardous canal locks of the lower estuary to establish an official guild inspection station aboard the porcelain clay wharves.
        stakes:
          external: Losing pilot clearance and running the ceramic barge aground in toxic chemical backwash.
          internal: Admitting that her official assayer status cannot insulate her from the environmental degradation choking the river-dwellers.
      conflict:
        opposition:
          type: environment
          description: Corrosive sulfurous river fumes, clogged lock mechanisms, and turbulent industrial back-siphonage from Orly Group cracking towers.
        escalation:
          beats:
          - Lock gates jam under heavy coal-slurry silt, forcing manual lever engagement amidst toxic mist.
          - A rogue pressure surge from an upstream discharge pipe rocks the barge, threatening to capsize the fragile porcelain clay containers.
          - Basuki Tjokroaminoto issues a warning that the canal currents are reversing due to unauthorized upstream sluice flushes.
      disaster:
        outcome: Partial success
        consequence:
          plot: The vessel moors at the inspection wharf, but half of the mooring stanchions suffer structural shear, leaving them physically marooned in the cartel core.
          character: Nomathemba realizes the industrial river-port is vastly more volatile and unmanaged than metropolitan records claimed.
    sequel:
      reaction:
        emotional:
          immediate: Dread laced with cold vertigo at the sheer scale of ambient chemical ruin.
          physical: Stinging bronchial tubes and an uncontrollable tremor in the fingers holding the brass sampling calipers.
        processing: She reconciles the polished guild literature with the grim, caustic reality of the estuarine canals.
      dilemma:
        options:
        - choice: Remain aboard the barge until municipal tugs arrive to reinforce the slip.
          cost: Losing valuable daylight and allowing Orly Group overseers time to conceal illicit dock activity.
          risk: Being declared derelict by dock authorities and turned away without securing samples.
        - choice: Disembark immediately into the toxic dock mist using uncertified respirator filters.
          cost: Exposing lung tissue to ambient phenol vapours and voiding indemnity coverage.
          risk: Suffering acute toxic inhalation while conducting preliminary assays.
      decision:
        chosen_option: Disembark immediately into the toxic dock mist using uncertified respirator filters.
        rationale: Delay guarantees that refinery agents will scrub any visible bio-allotropic residues before she can document them.
        new_goal: Access the Orly Group Enterolobium cracking manifold before the shift change to inspect batch returns.
    context: MO
  - scene:
      goal:
        description: Extract an unadulterated fluid sample from the high-pressure Enterolobium catalytic cracking manifold.
        stakes:
          external: Confiscation of her guild credentials and immediate arrest by Tariq Al-Jamil's private security detail.
          internal: Betraying the administrative oaths she spent decades cultivating within the Assayer Directorate.
      conflict:
        opposition:
          type: system
          description: The Orly Group's institutional data censors and Tariq Al-Jamil's labyrinthine regulatory quarantine procedures.
        escalation:
          beats:
          - Automated manifold safety interlocks reject her assayer cipher, triggering a silent security alert.
          - Tariq Al-Jamil arrives on the catwalk above, questioning her presence outside standard quarterly audit schedules.
          - A secondary feed line reveals an anomalous pulse, showing non-Newtonian viscosity within supposedly inert synthetic resins.
      disaster:
        outcome: Success with cost
        consequence:
          plot: Nomathemba captures an active specimen of the self-organizing polymer, but Tariq logs her unauthorized breach and alerts company enforcers.
          character: Nomathemba is shaken by the definitive visual proof that the cartel's plastics are undergoing biological replication.
    sequel:
      reaction:
        emotional:
          immediate: Intellectual terror mixed with vindictive scientific awe.
          physical: Nausea and rapid pulse as she observes the vial warm spontaneously against her palm.
        processing: She understands that the cartel's entire economic premise of chemical inertness is an intentional, dangerous fabrication.
      dilemma:
        options:
        - choice: Turn the sample over to Tariq in exchange for professional leniency and a silent transfer out of the estuary.
          cost: Complicity in an impending ecological catastrophe and the death of her intellectual integrity.
          risk: Tariq quietly liquidates her anyway to eliminate any living witness.
        - choice: Conceal the sample and seek out Solrun Elvarsdóttir in the fringe petro-botanical archives for analysis.
          cost: Branding herself an industrial fugitive and facing corporate assassination.
          risk: Solrun's advanced neuropathy may have already destroyed her ability to verify the allotropic strains.
      decision:
        chosen_option: Conceal the sample and seek out Solrun Elvarsdóttir in the fringe petro-botanical archives for analysis.
        rationale: Only Solrun's historic cultivar records can prove the living resin's cellular origin beyond corporate denial.
        new_goal: Rendezvous with Solrun in the submerged lower archive vaults beneath the salt docks.
    context: IO
  - scene:
      goal:
        description: Convince Solrun Elvarsdóttir to unlock her classified botanical archives to identify the living allotrope strain.
        stakes:
          external: Permanent loss of the only historical baseline data on pre-industrial Enterolobium hybridization.
          internal: Surrendering her remaining identity as an objective imperial assayer to become an illegal rebel researcher.
      conflict:
        opposition:
          type: person
          description: Solrun Elvarsdóttir, whose bitter cynicism and phenol-induced neuropathy make her distrustful of any guild emissary.
        escalation:
          beats:
          - Solrun refuses to open the pneumatic filing racks, accusing Nomathemba of being a company extraction spy.
          - Nomathemba reveals the pulsating sample, forcing Solrun to acknowledge the catastrophic maturity of the mutation.
          - Solrun demands Nomathemba renounce her guild seal and destroy her administrative ledger before she cooperates.
      disaster:
        outcome: Success with cost
        consequence:
          plot: Solrun agrees to cross-reference the genome, but Orly Group incinerator drones locate their position by tracking Nomathemba's guild telemetry.
          character: Nomathemba crushes her own inspector medallion, psychologically cutting herself off from her former life forever.
    sequel:
      reaction:
        emotional:
          immediate: A hollow, disorienting shock of irreversible self-disenfranchisement.
          physical: Sweat cooling rapidly under her thoriated rubber collar; phantom numbness in her fingers.
        processing: She realizes that obedience was merely cowardice dressed as methodology, and that guild science is corporate containment.
      dilemma:
        options:
        - choice: Flee into the general populace and abandon the research before the drones breach the vaults.
          cost: Leaving the basin to its uncontrolled bio-synthetic collapse while surviving as a disgraced drifter.
          risk: Being hunted down by Orly mercenaries without any leverage or allies.
        - choice: Transport Solrun's fragile glass archives onto Basuki's porcelain barge to set up an improvised laboratory.
