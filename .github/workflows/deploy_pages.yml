name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Daily Generate and Release", "Weekly Stories Compilation"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    # Only deploy if triggered directly (push/dispatch) or if the upstream workflow succeeded
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'googleai/gemini-flash-latest' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Build omni-archivist
        run: |
          go version
          go build -o omni-archivist .

      - name: Compile static site for GitHub Pages
        run: |
          ./omni-archivist compile pages --dir artifacts --output public --cname omni-archivist.raitucarp.name

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
